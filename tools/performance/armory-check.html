<!doctype html><html><head><meta charset="utf-8"><title>Immune Protocol armory check</title></head><body style="margin:0;background:#171018;color:#daf5bd;font:13px monospace"><p id="status" style="margin:4px 8px">…</p><!-- Renders every weapon with every part option on the armory bench (?weapons=sniper,pistol) and
reports any build whose weapon or attachment points fall outside the picture, or whose part card is blank. --><pre id="report" style="margin:4px 8px"></pre><div id="sheets"></div><script type="module">
import * as THREE from './vendor/three.module.js';
import { prepareArmoryArt } from './armory-art.mjs';
import { DEFAULT_WEAPON_LOADOUT, TURRET_SLOTS, WEAPON_ORDER, WEAPON_SLOTS, loadoutWithWeapon, loadoutWithBuild, loadoutInSlot, normalizeTurretBuild } from './weapon-mods.mjs';
const query = new URLSearchParams(location.search);
const status = document.querySelector('#status'), report = document.querySelector('#report');
const problems = [];
const note = text => { problems.push(text); report.textContent += text + '\n'; };
try {
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  const art = await prepareArmoryArt(renderer);
  // ?weapons=turret renders the auto-turret with each part and a few dressed builds.
  if (query.get('weapons') === 'turret') {
    const builds = [['stock', {}]];
    for (const [slot, { options }] of Object.entries(TURRET_SLOTS)) for (const option of Object.keys(options)) if (option !== 'standard') builds.push([slot + ':' + option, { [slot]: option }]);
    builds.push(['tiger + flames + star', { skin: 'tiger', decal: 'flames', sticker: 'star', charm: 'star', accent: 'amber' }]);
    builds.push(['cyberpunk + circuit', { skin: 'cyberpunk', decal: 'circuit', sticker: 'skull', charm: 'skull', finish: 'obsidian', accent: 'violet', barrel: 'heavy-barrel', sensor: 'long-range-sensor', receiver: 'shock-receiver' }]);
    builds.push(['crimson finish', { finish: 'crimson', accent: 'ice', receiver: 'cryo-receiver', charm: 'clover' }]);
    const W = 480, H = 300;
    const sheet = document.createElement('canvas');
    sheet.width = W * 3; sheet.height = H * Math.ceil(builds.length / 3);
    const c = sheet.getContext('2d');
    c.font = 'bold 14px monospace';
    for (const [index, [label, build]] of builds.entries()) {
      const picture = art.render({ weapon: 'turret', ...normalizeTurretBuild(build) }, { yaw: .7, pitch: .15 });
      const x = (index % 3) * W, y = Math.floor(index / 3) * H;
      c.drawImage(picture, x, y, W, H);
      c.fillStyle = '#fff'; c.fillText(label, x + 6, y + 16);
    }
    document.querySelector('#sheets').append(sheet);
    status.textContent = 'DONE: turret';
    throw Object.assign(new Error('turret only'), { done: true });
  }
  const weapons = query.get('weapons')?.split(',') ?? WEAPON_ORDER;
  const W = 320, H = 200;
  // How much of the picture changes when the weapon is turned: nothing moves if it is not there.
  const sample = canvas => {
    const probe = document.createElement('canvas');
    probe.width = 64; probe.height = 40;
    const c = probe.getContext('2d', { willReadFrequently: true });
    c.drawImage(canvas, 0, 0, 64, 40);
    return c.getImageData(0, 0, 64, 40).data;
  };
  const moved = (a, b) => { let n = 0; for (let i = 0; i < a.length; i += 4) if (Math.abs(a[i] - b[i]) + Math.abs(a[i + 1] - b[i + 1]) + Math.abs(a[i + 2] - b[i + 2]) > 24) n++; return n / (a.length / 4); };
  for (const weapon of weapons) {
    status.textContent = weapon;
    const base = loadoutWithWeapon(DEFAULT_WEAPON_LOADOUT, 'primary', weapon);
    const builds = [['stock', base]];
    for (const [slot, { options }] of Object.entries(WEAPON_SLOTS)) {
      for (const option of Object.keys(options)) builds.push([slot + ':' + option, loadoutWithBuild(base, weapon, { [slot]: option })]);
    }
    const sheet = document.createElement('canvas');
    sheet.width = W * 4; sheet.height = H * Math.ceil(builds.length / 4);
    sheet.dataset.weapon = weapon;
    const c = sheet.getContext('2d');
    c.font = 'bold 13px monospace';
    const cards = art.thumbnailsFor(weapon);
    for (const [index, [label, loadout]] of builds.entries()) {
      const edited = loadoutInSlot(loadout, 'primary');
      const turned = sample(art.render(edited, { yaw: 1.2, pitch: .2 }));
      const picture = art.render(edited, { yaw: 0, pitch: 0 });
      const change = moved(sample(picture), turned);
      const x = (index % 4) * W, y = Math.floor(index / 4) * H;
      c.drawImage(picture, x, y, W, H);
      const anchors = art.anchors() ?? {};
      const outside = Object.entries(anchors).filter(([, p]) => p.x < .02 || p.x > .98 || p.y < .02 || p.y > .98).map(([slot]) => slot);
      for (const p of Object.values(anchors)) { c.fillStyle = '#c8f794'; c.fillRect(x + p.x * W - 2, y + p.y * H - 2, 4, 4); }
      const [slot, option] = label.split(':');
      const card = option ? cards[slot]?.[option] : null;
      let blank = false;
      if (option) {
        if (!card) blank = true;
        else {
          await card.decode();
          c.drawImage(card, x + W - 84, y + H - 50, 80, 46);
          const data = sample(card);
          let low = 255, high = 0;
          for (let i = 0; i < data.length; i += 4) { low = Math.min(low, data[i + 1]); high = Math.max(high, data[i + 1]); }
          blank = high - low < 40;
        }
      }
      const bad = change < .04 || outside.length || blank;
      c.fillStyle = bad ? '#ff735d' : '#fff';
      c.fillText(label + (bad ? ' !' : ''), x + 6, y + 16);
      if (change < .04) note(`${weapon} ${label}: weapon not visible (only ${(change * 100).toFixed(1)}% of the picture moves when it turns)`);
      if (outside.length) note(`${weapon} ${label}: ${outside.join(', ')} outside the picture`);
      if (blank) note(`${weapon} ${label}: part card is blank or missing`);
    }
    document.querySelector('#sheets').append(sheet);
    await new Promise(requestAnimationFrame);
  }
  status.textContent = problems.length ? 'PROBLEMS: ' + problems.length : 'DONE: every build is in frame';
} catch (error) { if (!error.done) { status.textContent = 'FAIL: ' + error.message; console.error(error); } }
</script></body></html>
