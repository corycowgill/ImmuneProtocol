<!doctype html><html lang="en"><meta charset="utf-8"><title>Organ hazard check</title>
<style>body{margin:20px;background:#131918;color:#dff2d9;font:14px/1.5 monospace}canvas{width:960px;height:540px;max-width:100%}button,select{margin:5px;padding:8px}</style>
<h1>Organ hazards and set dressing</h1><p id="status">Loading…</p>
<select id="area"></select><select id="phase"><option>active</option><option>warning</option><option>recovery</option></select>
<select id="view"><option>hazard</option><option>overview</option><option>floor</option><option>ground</option></select>
<canvas id="world"></canvas>
<script type="module">
// Loads one organ arena, holds its hazard in a chosen phase (moving hazards sweep on their own
// schedule) and frames a camera on it, so the hazard effects and level props can be inspected.
// ?area=stomach&phase=active&view=hazard picks the starting state; window.hazards drives frames.
import { World } from './world.mjs';
import { Simulation } from './simulation.mjs';
import { ORGAN_MISSIONS } from './organs.mjs';
const params = new URL(location.href).searchParams;
const status = document.querySelector('#status');
const areas = ['lungs', 'stomach', 'intestines', 'colon', 'lymph', 'ear', 'brain', 'artery', 'junction', 'heart'];
const selects = { area: document.querySelector('#area'), phase: document.querySelector('#phase'), view: document.querySelector('#view') };
for (const area of areas) selects.area.add(new Option(area, area));
selects.area.value = params.get('area') ?? 'stomach';
selects.phase.value = params.get('phase') ?? 'active';
selects.view.value = params.get('view') ?? 'hazard';
try {
  const area = selects.area.value;
  const world = new World(document.querySelector('#world'), area);
  if (params.has('low')) world.setQuality('low');
  // ?noweapon hides the first-person weapon so the effects fill the frame.
  if (params.has('noweapon')) world.weaponScene.visible = false;
  await world.prepareAll([area]);
  world.setArea(area);
  const sim = new Simulation(area, { ai: { seed: 4 } });
  sim.start();
  sim.enemies = [];
  let clock = 0, sweep = 0;
  const hazard = ORGAN_MISSIONS[area]?.hazard;
  function hold() {
    if (!hazard) return;
    const phase = selects.phase.value;
    const state = sim.createOrganPhase(phase);
    // Moving hazards sweep through their path while active.
    if (phase === 'active' && hazard.endZ !== undefined) state.z = hazard.z + (hazard.endZ - hazard.z) * sweep;
    if (phase === 'active' && hazard.endX !== undefined) state.x = hazard.x + (hazard.endX - hazard.x) * sweep;
    state.remaining = hazard[phase] * (1 - sweep);
    sim.organ = state;
  }
  function frame() {
    const state = sim.organ ?? { x: 0, z: 0 };
    const view = selects.view.value, player = sim.player;
    const reach = (state.radius ?? Math.max(state.width ?? 10, 10) / 2) || 8;
    const back = Math.max(13, reach * 1.7);
    if (view === 'hazard') Object.assign(player, { x: state.x + back * .45, y: 3.4 + reach * .2, z: state.z + back });
    else if (view === 'overview') Object.assign(player, { x: 10, y: 6, z: 40 });
    // A long stretch of open floor at standing height, where repetition shows most.
    else if (view === 'ground') Object.assign(player, { x: 14, y: 1.7, z: 44 });
    else Object.assign(player, { x: state.x - 2, y: 1.7, z: state.z + reach + 6 });
    const look = view === 'overview' ? { x: 0, z: -6 } : view === 'ground' ? { x: -4, z: 8 } : state;
    player.yaw = Math.atan2(player.x - look.x, player.z - look.z);
    player.pitch = view === 'ground' ? -.32 : -Math.atan2(player.y - 1.2, Math.hypot(player.x - look.x, player.z - look.z));
  }
  function step(dt) {
    clock += dt; sim.clock = clock;
    hold(); frame();
    sim.events = [];
    world.render(sim, dt, { moveX: 0, moveZ: 0, lookX: 0, lookY: 0 }, false);
  }
  window.hazards = {
    ready: true, world, sim,
    set(options) { for (const [key, value] of Object.entries(options)) if (key === 'sweep') sweep = value; else selects[key].value = value; step(1 / 60); },
    step(frames = 1) { for (let i = 0; i < frames; i++) step(1 / 60); },
  };
  for (let i = 0; i < 3; i++) step(1 / 60);
  status.textContent = 'Ready: ' + area + (hazard ? ' · ' + hazard.name : ' · no hazard');
  if (!params.has('static')) {
    let last = 0;
    const loop = at => { requestAnimationFrame(loop); const dt = Math.min(.05, (at - (last || at)) / 1000); last = at; sweep = (sweep + dt / (hazard?.active ?? 5)) % 1; step(dt); };
    requestAnimationFrame(loop);
  }
} catch (error) { status.textContent = 'FAIL: ' + error.message; console.error(error); }
</script></html>
